name: Release macOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to see draft releases in the preflight check.
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check version and existing releases
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-preflight.sh

  release:
    needs: preflight
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - name: Set up Rust
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add aarch64-apple-darwin
      - run: bun install --frozen-lockfile
      - name: Check frontend
        run: |
          bun run lint
          bun run build
          bun run test
      - name: Check Rust
        run: |
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Check browser behavior
        run: |
          bun x playwright install chromium webkit
          bun run test:e2e
      - name: Recheck release availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-preflight.sh
      - name: Import Apple credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_PRIVATE_KEY APPLE_API_KEY APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "Missing release environment secret: $name" >&2
              exit 1
            fi
          done
          umask 077
          keychain="$RUNNER_TEMP/tau-signing.keychain-db"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/tau-signing.p12"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/tau-notary.p8"
          security list-keychains -d user > "$RUNNER_TEMP/tau-keychains.txt"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/tau-signing.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          python3 - "$keychain" "$RUNNER_TEMP/tau-keychains.txt" <<'PY'
          import pathlib, shlex, subprocess, sys
          previous = shlex.split(pathlib.Path(sys.argv[2]).read_text())
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', sys.argv[1], *previous], check=True)
          PY
          rm "$RUNNER_TEMP/tau-signing.p12"
      - name: Build, sign, notarize, and verify
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/tau-notary.p8
        run: bun run release:macos
      - name: Remove Apple credentials
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, shlex, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          previous = root / 'tau-keychains.txt'
          try:
              if previous.exists():
                  subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *shlex.split(previous.read_text())], check=True)
          finally:
              try:
                  keychain = root / 'tau-signing.keychain-db'
                  if keychain.exists():
                      subprocess.run(['security', 'delete-keychain', str(keychain)], check=True)
              finally:
                  for name in ['tau-signing.p12', 'tau-notary.p8', 'tau-keychains.txt']:
                      (root / name).unlink(missing_ok=True)
          PY
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          bash scripts/release-preflight.sh
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
          shopt -s nullglob
          dmgs=(*.dmg)
          test "${#dmgs[@]}" -eq 1
          shasum -a 256 "${dmgs[0]}" > SHA256SUMS.txt
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          gh release create "$TAG" "${dmgs[0]}" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Tau v$VERSION" --notes ''
