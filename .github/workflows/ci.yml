name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      keychain_smoke:
        description: Run only the disposable synthetic Keychain diagnostic (no production credentials)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.keychain_smoke && 'keychain-smoke-' || '' }}${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    if: ${{ !inputs.keychain_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:tooling

  native:
    if: ${{ !inputs.keychain_smoke }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/gpui/target
      CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: 'off'
      CARGO_PROFILE_TEST_SPLIT_DEBUGINFO: 'off'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Set up Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.1
      - name: Verify Metal compiler
        run: |
          if ! xcrun metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun metal --version
          fi
      - run: bun run prepare
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui -> target
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gpui/Cargo.lock', 'crates/*/Cargo.lock', 'gpui/patches/*.patch') }}
      - name: Rust formatting and strict Clippy
        run: bun scripts/native.ts check
      - name: Shared service and session contracts
        run: bun run test:core
      - name: Native UI and retained editor regressions
        run: bun run test:native
      - name: Candidate packaging regressions (no Apple credentials)
        run: bun run test:packaging
      - name: Signing helper compile and pure checks (no Keychain APIs)
        run: bun run test:keychain
      - name: Optimized product build
        run: bun run build
      - name: Record rendering coverage boundary
        if: always()
        run: |
          echo 'Hosted checks cover native library/editor and shared Rust tests, not Metal paint execution.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Run bun run test:metal on a Mac with an available Metal device before handoff.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Native OS and real-Pi acceptance remain explicit opt-ins.' >> "$GITHUB_STEP_SUMMARY"

  keychain-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.keychain_smoke
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Disposable synthetic helper acceptance only
        run: |
          set +x
          umask 077
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 15
          test "$RUNNER_ENVIRONMENT" = github-hosted
          ROOT="$(cd "$RUNNER_TEMP" && pwd -P)/tau-keychain-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$ROOT"
          xcrun swiftc -O -target arm64-apple-macosx15.0 -D KEYCHAIN_TESTS -parse-as-library scripts/macos/signing-keychain.swift scripts/macos/signing-keychain-tests.swift -o "$ROOT/keychain-tests"
          "$ROOT/keychain-tests"
          xcrun swiftc -O -target arm64-apple-macosx15.0 -parse-as-library scripts/macos/signing-keychain.swift -o "$ROOT/keychain-helper"
          if ! bun scripts/macos/keychain-smoke.ts "$ROOT/keychain-helper" "$ROOT"; then
            python3 - "$ROOT" <<'PY'
          import pathlib, stat, sys
          root = pathlib.Path(sys.argv[1])
          known = {'.tau-signing-keychain.json', 'signing.keychain', 'signing.keychain-db', 'signing.keychain-db-db', 'signing.keychain-db-wal', 'signing.keychain-db-shm', 'signing.keychain-db-journal'}
          for directory in root.glob('tau-synthetic-*/identity'):
              for entry in sorted(directory.iterdir()):
                  info = entry.lstat()
                  label = entry.name if entry.name in known else 'unrecognized filename'
                  print(f'Owned helper file: {label}; regular={stat.S_ISREG(info.st_mode)}; links={info.st_nlink}')
          PY
            exit 1
          fi
      - name: Record diagnostic boundary
        if: always()
        run: |
          echo 'Synthetic Keychain diagnostic only: no production credentials, app build, notarization or launch.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This manual run is not the push/main aggregate check required for candidate dispatch.' >> "$GITHUB_STEP_SUMMARY"

  check:
    if: always() && !inputs.keychain_smoke
    needs: [tooling, native]
    runs-on: ubuntu-latest
    steps:
      - name: Require both lanes to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [[ "$RESULTS" != "success,success" ]]; then
            echo "CI lanes did not both pass: $RESULTS"
            exit 1
          fi
