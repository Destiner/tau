[package]
name = "tau-observability"
version = "0.2.1"
edition = "2021"
license = "MIT"

[dependencies]
tau-core = { path = "../tau-core" }
opentelemetry = "0.32"
opentelemetry-semantic-conventions = { version = "0.32", features = ["semconv_experimental"] }
opentelemetry_sdk = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
otlp_export = []
