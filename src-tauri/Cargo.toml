[package]
name = "tau"
version = "0.1.2"
description = "A desktop UI for the Pi coding agent"
authors = ["Destiner"]
license = "MIT"
edition = "2021"

[lib]
name = "tau_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
# WKWebView background colors otherwise silently do nothing on macOS.
# This uses private WebKit API; Tau is distributed outside the Mac App Store.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
dirs = "6"
opentelemetry = "0.32"
opentelemetry-semantic-conventions = { version = "0.32", features = ["semconv_experimental"] }
opentelemetry_sdk = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2.4.1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPanel", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSURL"] }
objc2-quick-look-ui = { version = "0.3.2", default-features = false, features = ["QLPreviewItem", "QLPreviewView", "objc2-app-kit"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[features]
# Off by default: no code in this feature is compiled into an ordinary
# build, so it adds no runtime dependency to the shipped app. Enables an
# opt-in, development-only OTLP/HTTP JSON export path honoring the standard
# OTEL_EXPORTER_OTLP_* environment variables, reusing the same OTLP JSON this
# module already produces for local storage — no new crate, since it is a
# raw std::net::TcpStream HTTP/1.1 client, not a full HTTP stack.
otlp_export = []
