[package]
name = "tau"
version = "0.2.6"
description = "A desktop UI for the Pi coding agent"
authors = ["Destiner"]
license = "MIT"
edition = "2021"

[lib]
name = "tau_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
# WKWebView background colors otherwise silently do nothing on macOS.
# This uses private WebKit API; Tau is distributed outside the Mac App Store.
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
dirs = "6"
opentelemetry = "0.32"
opentelemetry-semantic-conventions = { version = "0.32", features = ["semconv_experimental"] }
opentelemetry_sdk = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "blocking"] }
shell-words = "1"
tauri-plugin-opener = "2"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-window-state = "2.4.1"
tokio = { version = "1", features = ["rt", "time"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(target_os = "macos")'.dependencies]
flate2 = "1"
libc = "0.2"
tar = "0.4"
security-framework = "3.7"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
