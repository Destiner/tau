[package]
name = "tau-gpui-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit = { version = "=0.7.0", default-features = false, features = ["test-support"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "=5.3.0", default-features = false, features = ["default-fancy"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { package = "gpui-pre-macos", version = "=0.3.7", features = ["font-kit"] }

[patch.crates-io]
gpui-base = { path = ".cache/crates/gpui-base" }
gpui-pre = { path = ".cache/crates/gpui-pre" }
gpui-pre-macos = { path = ".cache/crates/gpui-pre-macos" }

[profile.dev]
debug = 1

[workspace]
exclude = [".cache/crates/gpui-base", ".cache/crates/gpui-pre", ".cache/crates/gpui-pre-macos"]
